[package]
name = "lattice-translator"
description = "Local ONNX translator worker for Lattice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lattice-translator"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ort = { version = "2.0.0-rc.13", features = ["copy-dylibs", "download-binaries", "std", "tls-native"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.20", features = ["onig"], default-features = false }

[lints]
workspace = true
